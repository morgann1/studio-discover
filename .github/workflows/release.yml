name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Install Rokit
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 📦 Install packages
        run: lute run install

      - name: 🏗️ Build StudioDiscover.rbxm
        run: lute run build

      - name: 🚀 Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: StudioDiscover.rbxm
          generate_release_notes: true

      - name: ☁️ Publish to Creator Store
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: lute run upload-plugin StudioDiscover.rbxm --tag "${{
          steps.meta.outputs.tag }}"
