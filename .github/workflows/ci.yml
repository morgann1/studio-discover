name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: lute scripts/install.luau

      - name: Lint
        run: lute scripts/lint.luau

      - name: Type check
        run: lute scripts/analyze.luau
