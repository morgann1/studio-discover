<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Studio Discover social image</title>
    <style>
      @font-face {
        font-family: "Builder Sans";
        src: url("../src/assets/fonts/BuilderSans-SemiBold.woff2") format("woff2");
        font-weight: 600;
      }

      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        position: relative;
        background: #121215;
        color: #f7f7f8;
        font-family: "Builder Sans", sans-serif;
        font-weight: 600;
        -webkit-font-smoothing: antialiased;
      }

      .brand {
        position: absolute;
        top: 64px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
      }

      h1 {
        position: absolute;
        bottom: 64px;
        left: 64px;
        width: 420px;
        margin: 0;
        font-size: 60px;
        line-height: 1.05;
      }

      .shot {
        position: absolute;
        top: 64px;
        left: 520px;
        border: 1px solid #3b3c41;
        border-radius: 6px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../../.github/assets/icon.png" alt="" width="40" height="40" />Studio Discover
    </div>
    <h1>Your package manager. Right inside Studio.</h1>
    <img
      class="shot"
      src="../../.github/assets/screenshot-dark.png"
      alt=""
      width="958"
      height="674"
    />
  </body>
</html>
